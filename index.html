<html lang="es" style="--accent: #ff2d95;"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabybelt13 • Linktree</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Inter:wght@300;400;500&amp;display=swap');

    :root {
      --pink: #ff2d95;
      --rose: #e11d48;
      --fuchsia: #c026ff;
    }

    body {
      font-family: 'Inter', system_ui, sans-serif;
    }

    .script-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .glass-card {
      background: rgba(255, 240, 245, 0.28);
      border: 1px solid rgba(251, 207, 232, 0.75);
      box-shadow: 
        0 30px 60px -15px rgb(0 0 0 / 0.35),
        0 12px 12px -6px rgb(0 0 0 / 0.2),
        0 0 0 1px rgba(255,255,255,0.3) inset,
        0 0 20px -5px rgb(244 114 182 / 0.2);
    }

    .feminine-gradient {
      background: linear-gradient(145deg, rgba(255,241,247,0.28) 0%, rgba(252,231,243,0.22) 50%, rgba(243,232,255,0.26) 100%);
    }

    .link-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .link-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -100%;
      width: 40%;
      height: 200%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.45),
        transparent
      );
      transition: left 0.6s;
    }

    .link-btn:hover::after {
      left: 250%;
    }

    .link-btn:hover {
      transform: translateY(-3px) scale(1.022);
      box-shadow: 0 20px 30px -10px rgb(0 0 0 / 0.22), 0 10px 12px -6px rgb(0 0 0 / 0.12);
    }

    .link-btn:active {
      transform: scale(0.975) translateY(0);
    }

    .onlyfans-btn {
      background: linear-gradient(90deg, #ff2d95, #ff69b4);
      color: white;
      box-shadow: 0 10px 15px -3px rgb(236 72 153 / 0.4), 0 4px 6px -4px rgb(236 72 153 / 0.4);
    }

    .onlyfans-btn:hover {
      box-shadow: 0 20px 25px -8px rgb(236 72 153 / 0.5), 0 8px 10px -6px rgb(236 72 153 / 0.4);
    }

    .tiktok-btn {
      background: #18181b;
      color: white;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.15);
    }

    .facebook-btn {
      background: #1877f2;
      color: white;
      box-shadow: 0 10px 15px -3px rgb(24 119 242 / 0.35);
    }

    .section-title {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .modern-shadow {
      box-shadow: 0 20px 25px -15px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }

    .heart-burst {
      position: fixed;
      z-index: 99999;
      pointer-events: none;
      user-select: none;
      animation: heart-fly 1650ms cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      color: #ff69b4;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.25);
      filter: drop-shadow(0 3px 4px rgb(0 0 0 / 0.2));
      will-change: transform, opacity;
    }

    .sparkle-burst {
      position: fixed;
      z-index: 99998;
      pointer-events: none;
      user-select: none;
      animation: sparkle-pop 1100ms ease-out forwards;
      filter: drop-shadow(0 1px 2px rgb(251 207 232 / 0.6));
      will-change: transform, opacity;
    }

    @keyframes heart-fly {
      0% {
        transform: translateY(12px) translateX(0) rotate(var(--rot, 0deg)) scale(0.35);
        opacity: 0.6;
      }
      12% {
        transform: translateY(-8px) translateX(calc(var(--drift, 0px) * 0.2)) rotate(var(--rot, 0deg)) scale(1.1);
        opacity: 1;
      }
      35% {
        opacity: 1;
      }
      100% {
        transform: translateY(-260px) translateX(var(--drift, 0px)) rotate(calc(var(--rot, 0deg) * 3.4)) scale(0.75);
        opacity: 0;
      }
    }

    @keyframes sparkle-pop {
      0% {
        transform: scale(0.2) translateY(0);
        opacity: 0.9;
      }
      30% {
        transform: scale(1.1) translateY(-30px);
        opacity: 1;
      }
      100% {
        transform: scale(0.4) translateY(-95px) translateX(var(--drift, 0px));
        opacity: 0;
      }
    }

    .logo-wrapper {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  filter 0.4s ease;
      cursor: pointer;
      will-change: transform;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    .logo-wrapper:focus,
    .logo-wrapper:active,
    .logo-wrapper:focus-visible {
      outline: none !important;
      box-shadow: none !important;
      border: none;
    }

    .logo-wrapper:active {
      transform: scale(0.84) !important;
      transition-duration: 70ms !important;
    }

    /* Soft feminine breathing pulse - only when logo is in pretty pink mode (no hard rectangle) */
    @keyframes logo-pink-breathing {
      0%, 100% { transform: scale(1.015); }
      50% { transform: scale(1.045); }
    }

    .logo-wrapper.logo-pink-pulse {
      animation: logo-pink-breathing 2.1s ease-in-out infinite;
      filter: brightness(1.02);
    }

    .logo-wrapper.logo-pink-pulse:hover {
      animation-duration: 1.55s;
    }

    .profile-ring {
      box-shadow: 
        0 0 0 6px rgba(251, 207, 232, 0.35),
        0 0 0 12px rgba(244, 114, 182, 0.12),
        0 10px 15px -3px rgb(0 0 0 / 0.2);
      transition: box-shadow 0.3s ease;
    }

    .profile-ring:hover {
      box-shadow: 
        0 0 0 8px rgba(251, 207, 232, 0.5),
        0 0 0 16px rgba(244, 114, 182, 0.18),
        0 15px 20px -4px rgb(0 0 0 / 0.25);
    }

    .linktree-bg {
      background-image: url('IMAGEN FONDO.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Mobile background slideshow styles */
    .mobile-slideshow {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .mobile-slideshow .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      background-attachment: scroll;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .mobile-slideshow .slide.active {
      opacity: 1;
    }

    /* Mobile-specific background + layout tweaks */
    @media (max-width: 768px) {
      .linktree-bg {
        background-image: none;
      }

      .mobile-slideshow {
        display: block;
      }

      /* Better mobile card */
      .glass-card {
        max-width: calc(100% - 1.25rem);
        padding: 1.35rem 1.1rem 1.5rem !important;
        border-radius: 2.25rem;
      }

      /* Reduce top/bottom padding on the main content wrapper for mobile */
      .relative.z-10.min-h-screen {
        padding-top: 1.1rem !important;
        padding-bottom: 1.1rem !important;
      }

      /* Slightly smaller profile ring on mobile */
      .profile-ring {
        width: 7rem !important;
        height: 7rem !important;
      }

      /* Scale down the big logo a bit on mobile so it fits nicely */
      .logo-img {
        width: 210px !important;
        max-width: 230px !important;
      }
    }

    .feminine-text {
      color: #ffffff; /* <-- AQUÍ cambias el color del texto "Modelo y creadora de contenido." */
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .bio-subtitle {
      color: #f9b6fd; /* Color específico para "Bienvenido a mi universo exclusivo." */
    }

    .card-enter {
      animation: cardPop 920ms cubic-bezier(0.18, 1.0, 0.3, 1) both;
    }

    @keyframes cardPop {
      0% {
        opacity: 0;
        transform: translateY(55px) scale(0.82) rotate(-1.5deg);
        filter: blur(10px) brightness(0.7);
      }
      55% {
        opacity: 0.95;
        transform: translateY(-6px) scale(1.035) rotate(0.6deg);
        filter: blur(2px) brightness(1.05);
      }
      78% {
        transform: translateY(1.5px) scale(0.985) rotate(-0.2deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
        filter: blur(0) brightness(1);
      }
    }

    .btn-label {
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .soft-glow {
      box-shadow: 0 0 15px -3px rgb(244 114 182 / 0.25);
    }
  </style>
</head>

  <script>
    // Tailwind configuration - feminine pink/rose palette
    function initTailwind() {
      document.documentElement.style.setProperty('--accent', '#ff2d95');
      
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'script': ['Playfair Display', 'Georgia', 'serif']
            }
          }
        }
      };
    }

    // Spectacular heart + sparkle burst (much more vistoso)
    function createHeartBurst(wrapper) {
      const rect = wrapper.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height * 0.42;
      const hearts = ['♥', '❤'];
      const sparkles = ['✦', '★'];

      // Big dramatic heart burst
      const heartCount = 26;
      for (let i = 0; i < heartCount; i++) {
        const el = document.createElement('div');
        el.className = 'heart-burst';
        el.textContent = hearts[Math.floor(Math.random() * hearts.length)];

        const spreadX = (Math.random() - 0.5) * (rect.width * 1.45);
        const spreadY = (Math.random() - 0.5) * 52;

        const x = centerX + spreadX;
        const y = centerY + spreadY;

        const size = 15 + Math.random() * 26;
        const drift = (Math.random() - 0.5) * 130;
        const rot = (Math.random() - 0.5) * 75;
        const delay = Math.random() * 90;

        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.fontSize = `${size}px`;
        el.style.setProperty('--drift', `${drift}px`);
        el.style.setProperty('--rot', `${rot}deg`);
        el.style.animationDelay = `-${delay}ms`;

        // Pink color variety (no emoji dependency)
        const r = Math.random();
        el.style.color = (r > 0.5) ? '#ff69b4' : '#ff1493';
        if (r > 0.7) {
          el.style.textShadow = '0 0 6px #ff69b4';
        }

        document.body.appendChild(el);

        setTimeout(() => {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 1950);
      }

      // Extra sparkles for wow factor
      const sparkleCount = 14;
      for (let i = 0; i < sparkleCount; i++) {
        const sp = document.createElement('div');
        sp.className = 'sparkle-burst';
        sp.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];

        const spreadX = (Math.random() - 0.5) * (rect.width * 1.1);
        const spreadY = (Math.random() - 0.5) * 28;

        const x = centerX + spreadX;
        const y = centerY + spreadY;

        const size = 9 + Math.random() * 13;
        const drift = (Math.random() - 0.5) * 55;
        const delay = Math.random() * 55;

        sp.style.left = `${x}px`;
        sp.style.top = `${y}px`;
        sp.style.fontSize = `${size}px`;
        sp.style.setProperty('--drift', `${drift}px`);
        sp.style.animationDelay = `-${delay}ms`;
        sp.style.color = '#ffeb3b';

        document.body.appendChild(sp);

        setTimeout(() => {
          if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
        }, 1400);
      }

      // Bonus: quick expanding pink glow ring (very vistoso)
      createLogoRipple(wrapper, centerX, centerY);
    }

    // Expanding soft pink ripple ring around the logo (no hard box)
    function createLogoRipple(wrapper, cx, cy) {
      const ring = document.createElement('div');
      ring.style.position = 'fixed';
      ring.style.left = `${cx}px`;
      ring.style.top = `${cy}px`;
      ring.style.width = '12px';
      ring.style.height = '12px';
      ring.style.borderRadius = '9999px';
      ring.style.border = '2.5px solid rgba(244, 114, 182, 0.65)';
      ring.style.transform = 'translate(-50%, -50%)';
      ring.style.pointerEvents = 'none';
      ring.style.zIndex = '99997';
      ring.style.opacity = '0.85';
      document.body.appendChild(ring);

      // Animate the ring expansion + fade (pure JS for simplicity)
      let size = 12;
      let op = 0.85;
      const maxSize = Math.max(190, wrapper.offsetWidth * 1.35);
      const anim = setInterval(() => {
        size += 13.5;
        op -= 0.065;
        ring.style.width = `${size}px`;
        ring.style.height = `${size}px`;
        ring.style.opacity = Math.max(op, 0);
        ring.style.borderWidth = op > 0.3 ? '2.5px' : '1.5px';

        if (size >= maxSize || op <= 0.02) {
          clearInterval(anim);
          if (ring.parentNode) ring.parentNode.removeChild(ring);
        }
      }, 26);
    }

    // Pink recoloring effect for the logo (feminine + modern) - no rectangular box ever
    function setupLogoInteraction() {
      const wrapper = document.getElementById('logo-wrapper');
      const logoImg = wrapper.querySelector('img');
      
      if (!wrapper || !logoImg) return;
      
      let isPinkMode = false;
      const isMobile = window.innerWidth <= 768;
      const baseFilter = 'drop-shadow(0 10px 8px rgb(0 0 0 / 0.18))';
      
      // Pink transformation - toned down saturation especially for mobile to prevent oversaturation
      const pinkSat = isMobile ? '1600%' : '2200%';
      const pinkFilter = `drop-shadow(0 3px 6px rgb(251 207 232 / 0.5)) drop-shadow(0 8px 14px rgb(244 114 182 / 0.35)) brightness(0) saturate(100%) invert(18%) sepia(95%) saturate(${pinkSat}) hue-rotate(305deg) brightness(1.08) contrast(1.1)`;
      
      wrapper.addEventListener('click', function(e) {
        // Big beautiful burst + ripple
        createHeartBurst(wrapper);
        
        // Dramatic fun press animation (bigger, springy, no box)
        wrapper.style.transitionDuration = '90ms';
        wrapper.style.transform = 'scale(0.82)';

        // Make logo "pop" bigger when going pink
        setTimeout(() => {
          wrapper.style.transitionDuration = isPinkMode ? '380ms' : '520ms';
          wrapper.style.transitionTimingFunction = 'cubic-bezier(0.2, 1.2, 0.3, 1)';
          wrapper.style.transform = isPinkMode ? 'scale(1.03)' : 'scale(1.12)';
        }, 85);
        
        // Toggle pink feminine colors - glow lives only on the image filter (no wrapper rect)
        if (!isPinkMode) {
          logoImg.style.filter = pinkFilter;
          wrapper.style.filter = isMobile ? 'brightness(1.02)' : 'saturate(1.08) brightness(1.02)';
          isPinkMode = true;

          // Subtle extra pop glow on the image itself (no box around wrapper)
          setTimeout(() => {
            if (isPinkMode && logoImg) {
              logoImg.style.filter = pinkFilter + ' brightness(1.05)';
            }
          }, 160);
          
          // Gentle breathing pulse while in pink mode (very feminine & vistoso)
          wrapper.classList.add('logo-pink-pulse');
        } else {
          // Reset
          logoImg.style.filter = baseFilter;
          wrapper.style.filter = 'none';
          wrapper.style.transform = 'scale(1)';
          wrapper.classList.remove('logo-pink-pulse');
          isPinkMode = false;
        }
        
        // Settle back to nice size
        setTimeout(() => {
          if (wrapper) {
            wrapper.style.transitionDuration = '280ms';
            wrapper.style.transitionTimingFunction = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
            if (!isPinkMode) wrapper.style.transform = 'scale(1)';
            else if (isPinkMode) wrapper.style.transform = 'scale(1.015)';
          }
        }, 520);
      });
      
      // Nice hover effect on logo (preview pink glow)
      wrapper.addEventListener('mouseenter', () => {
        if (!isPinkMode) {
          logoImg.style.filter = baseFilter + ' brightness(1.05)';
        } else {
          logoImg.style.filter = pinkFilter + ' brightness(1.1)';
        }
      });
      
      wrapper.addEventListener('mouseleave', () => {
        logoImg.style.filter = isPinkMode ? pinkFilter : baseFilter;
        if (!isPinkMode) wrapper.style.filter = 'none';
      });
      
      // Keyboard accessibility (press Enter/Space on focused logo)
      wrapper.setAttribute('tabindex', '0');
      wrapper.setAttribute('role', 'button');
      wrapper.setAttribute('aria-label', 'Presiona para liberar corazones rosas y cambiar el color del logo');
      
      wrapper.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          createHeartBurst(wrapper);
          
          // simulate the click color toggle
          const clickEvent = new MouseEvent('click', { bubbles: true });
          wrapper.dispatchEvent(clickEvent);
        }
      });
    }

    // Subtle modern animations and interactions
    function setupAnimations() {
      // Profile pic fun interaction (small hearts on click too)
      const profile = document.getElementById('profile-pic');
      if (profile) {
        profile.addEventListener('click', function(e) {
          // More vistoso heart burst from profile pic too
          const rect = profile.getBoundingClientRect();
          for (let i = 0; i < 13; i++) {
            const h = document.createElement('div');
            h.className = 'heart-burst';
            h.textContent = '♥';
            const x = rect.left + 12 + Math.random() * (rect.width - 24);
            const y = rect.top + 12 + Math.random() * (rect.height - 24);
            h.style.left = x + 'px';
            h.style.top = y + 'px';
            h.style.fontSize = (11 + Math.random() * 14) + 'px';
            h.style.setProperty('--drift', (Math.random() - 0.5) * 62 + 'px');
            h.style.setProperty('--rot', (Math.random() * 60 - 25) + 'deg');
            if (Math.random() > 0.5) h.style.filter = 'hue-rotate(15deg) saturate(1.4)';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 1350);
          }
        });
      }

      // Button entrance stagger animation
      const buttons = document.querySelectorAll('.link-btn');
      buttons.forEach((btn, idx) => {
        btn.style.opacity = '0';
        btn.style.transform = 'translateY(12px)';
        
        setTimeout(() => {
          btn.style.transition = 'opacity 420ms ease, transform 420ms cubic-bezier(0.23,1,0.32,1)';
          btn.style.opacity = '1';
          btn.style.transform = 'translateY(0)';
        }, 420 + (idx * 85));
      });

      // Gentle continuous ring pulse on profile (very subtle)
      let pulseInterval = setInterval(() => {
        if (profile && !profile.matches(':hover')) {
          profile.style.boxShadow = '0 0 0 6px rgba(251, 207, 232, 0.35), 0 0 0 12px rgba(244, 114, 182, 0.12), 0 10px 15px -3px rgb(0 0 0 / 0.2)';
          setTimeout(() => {
            if (profile) {
              profile.style.boxShadow = '0 0 0 6px rgba(251, 207, 232, 0.35), 0 0 0 12px rgba(244, 114, 182, 0.12), 0 10px 15px -3px rgb(0 0 0 / 0.2)';
            }
          }, 850);
        }
      }, 6200);

      // Optional: stop pulse when user interacts a lot
      document.addEventListener('click', () => {
        // keep it light
      }, { once: true });
    }

    // Easter egg: hold logo for extra hearts
    function setupExtraHearts() {
      const wrapper = document.getElementById('logo-wrapper');
      let holdTimer = null;
      const isMobile = window.innerWidth <= 768;
      
      wrapper.addEventListener('mousedown', () => {
        holdTimer = setTimeout(() => {
          // Long press = bigger burst + force pink (no rectangular box, only beautiful glow on logo)
          createHeartBurst(wrapper);
          createHeartBurst(wrapper);
          
          const img = wrapper.querySelector('img');
          const strongSat = isMobile ? '1400%' : '1800%';
          const strongPink = `drop-shadow(0 3px 6px rgb(251 207 232 / 0.5)) drop-shadow(0 8px 14px rgb(244 114 182 / 0.35)) brightness(0) saturate(100%) invert(18%) sepia(95%) saturate(${strongSat}) hue-rotate(305deg) brightness(1.08) contrast(1.1)`;
          if (img) {
            img.style.filter = strongPink;
          }
          wrapper.style.filter = isMobile ? 'brightness(1.02)' : 'saturate(1.1)';
          wrapper.classList.add('logo-pink-pulse');
        }, 620);
      });
      
      ['mouseup', 'mouseleave'].forEach(evt => {
        wrapper.addEventListener(evt, () => {
          if (holdTimer) clearTimeout(holdTimer);
        });
      });
    }

    // Mobile background slideshow (3 photos with smooth crossfade)
    function initMobileSlideshow() {
      const slideshow = document.querySelector('.mobile-slideshow');
      if (!slideshow) return;

      const slides = slideshow.querySelectorAll('.slide');
      if (slides.length < 2) return;

      let current = 0;

      // Ensure first slide is active
      slides.forEach(s => s.classList.remove('active'));
      slides[0].classList.add('active');

      // Change image every 5 seconds with smooth 1.2s crossfade
      setInterval(() => {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
      }, 5000);
    }

    // Boot everything
    function init() {
      initTailwind();
      setupLogoInteraction();
      setupAnimations();
      setupExtraHearts();
      initMobileSlideshow();
      
      // Welcome console hint (for devs)
      console.log('%c[Gabybelt13 Linktree] Página lista ✨ Presiona el logo para corazones rosas y cambio de color.', 'color:#f9a8d4');
      
      // Make sure initial logo filter is clean (nice soft shadow)
      const logoImg = document.querySelector('#logo-wrapper img');
      if (logoImg) {
        setTimeout(() => {
          if (!logoImg.style.filter || logoImg.style.filter === '') {
            logoImg.style.filter = 'drop-shadow(0 10px 8px rgb(0 0 0 / 0.18))';
          }
        }, 70);
      }
    }

    // Start
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>


</body></html>
